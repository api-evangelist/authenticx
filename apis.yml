aid: authenticx
name: Authenticx
description: >-
  Authenticx is a healthcare conversation intelligence platform that ingests contact-center interactions —
  call audio, chat transcripts, and email — and applies speech analytics and machine-learning classifiers to
  surface patient and member experience signals, quality-assurance scoring, and pharmacovigilance / adverse-event
  detection. Its AcxAPI is a REST API described by a live OpenAPI 3.0.1 definition covering conversation insights,
  transcriptions, model results, evaluations, metadata, workflows, audio and text media upload, agent, hierarchy
  and role administration, and SCIM 2.0 user provisioning. Interaction ingestion also runs through out-of-the-box
  connectors for Genesys Cloud, Amazon Connect, NICE CXone, Five9, Vonage Contact Center and Talkdesk, plus
  Salesforce/MuleSoft conversation enrichment and SFTP batch delivery. Authentication is OAuth 2.0 client
  credentials against an OpenID Connect provider, with separate production and experimental (staging) hosts.
