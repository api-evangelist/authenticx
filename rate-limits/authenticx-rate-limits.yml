  note: >-
    Retry-After on a 429 is the one runtime rate-limit signal AcxAPI actually gives an agent, and it exists on
    exactly one of 46 operations — POST /Media/Upload, the audio ingest endpoint. There is no X-RateLimit-*
    and no RateLimit-*/RateLimit-Policy (RFC 9331), so a client learns nothing about remaining budget before
    it is refused; it can only react after the fact, and only on the upload path. The other 45 operations
    declare no 429 at all, so a caller cannot tell whether they are unlimited, limited-but-undeclared, or
    share the upload budget.
exhaustion_status_code: 429
