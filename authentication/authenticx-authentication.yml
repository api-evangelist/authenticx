schemes:
- name: OAuth2
  type: oauth2
  description: >-
    The only security scheme declared in the AcxAPI OpenAPI. Client credentials are issued by Authenticx during
    customer onboarding — there is no self-serve developer signup. The resulting bearer token is sent on every
    request as `Authorization: Bearer <access_token>`.
  flows:
  - flow: clientCredentials
    tokenUrl: https://api.beauthenticx.com/connect/token
    scopes:
    - acxapi
  sources:
  - openapi/authenticx-acxapi-openapi.yml
  client_authentication:
  - method: client_secret_post
    note: >-
      `client_id` and `client_secret` in an application/x-www-form-urlencoded body alongside
      `grant_type=client_credentials&scope=acxapi` (the form shown in the docs).
  - method: client_secret_basic
    note: >-
      Base64 `client-id:client-secret` in an `Authorization: Basic` header; grant type and scope still go in the
      form body. Documented as an accepted alternative.
