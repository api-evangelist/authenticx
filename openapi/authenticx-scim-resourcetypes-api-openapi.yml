openapi: 3.2.0
info:
  title: AcxApi Production (Scim) ResourceTypes API
  version: v1
servers:
- url: https://api.beauthenticx.com
  description: AcxApi Production Server
security:
- {}
tags:
- name: (Scim) ResourceTypes
paths:
  /scim/v2/ResourceTypes:
    get:
      tags:
      - (Scim) ResourceTypes
      summary: Get All Resource Types
      description: Returns, in ListResponse format, all the resource types defined by Authenticx
      responses:
        '200':
          description: All resource types defined by Authenticx
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse_Of_ResourceType'
      operationId: getScimV2ResourceTypes
      x-operation-id-source: derived
  /scim/v2/ResourceTypes/{ResourceTypeId}:
    get:
      tags:
      - (Scim) ResourceTypes
      summary: Get Resource Type
      description: Returns one resource type specified by the resource type id.
      parameters:
      - name: ResourceTypeId
        in: path
        description: The id of the resource type to get
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the resource type specified by the provided `ResourceTypeId`
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/AcxApi.Scim.Resources.ResourceType.ResourceType'
        '400':
          description: An invalid `ResourceTypeId` was provided
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/AcxApi.Scim.Models.ErrorResponse'
      operationId: getScimV2ResourceTypesByResourceTypeId
      x-operation-id-source: derived
components:
  schemas:
    AcxApi.Scim.Models.ErrorResponse:
      type: object
      properties:
        schemas:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of schemas for this error response.
        scimType:
          type:
          - string
          - 'null'
          description: The type of error this was, as defined by scim
          example: invalidSyntax
        detail:
          type:
          - string
          - 'null'
          description: A detailed error message explaining what went wrong
        status:
          type:
          - string
          - 'null'
          description: The status code of the response
          example: '400'
      additionalProperties: false
    AcxApi.Scim.Resources.ResourceType.SchemaExtension:
      type: object
      properties:
        schema:
          type:
          - string
          - 'null'
          description: The uri of the extended schema
          example: urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
        required:
          type: boolean
          description: Whether the extension is required
          example: true
      additionalProperties: false
    ListResponse_Of_ResourceType:
      type: object
      properties:
        schemas:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Always contains "urn:ietf:params:scim:api:messages:2.0:ListResponse".

            Declared as a property rather than a field so that it is serialized;

            System.Text.Json ignores fields by default.'
        itemsPerPage:
          type:
          - integer
          - 'null'
          description: The number of items returned per page
          format: int32
          example: 10
        startIndex:
          type:
          - integer
          - 'null'
          description: The 1-based index of the first result in the current page.
          format: int32
          example: 1
        totalResults:
          type: integer
          description: 'The total number of resources matching the request, which for a

            paginated request is larger than the number of resources returned.

            Falls back to the size of this page when the caller has not set it.

            <a href="https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2">Scim documentation on list responses</a>'
          format: int32
          example: 10
        Resources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AcxApi.Scim.Resources.ResourceType.ResourceType'
          description: The resources returned by this response
          readOnly: true
      additionalProperties: false
    AcxApi.Scim.Resources.ResourceType.ResourceType:
      type: object
      properties:
        schemas:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The schemas for this response
          example:
          - urn:ietf:params:scim:schemas:core:2.0:ResourceType
        id:
          type:
          - string
          - 'null'
          description: The id of this resource type
          example: User
        name:
          type:
          - string
          - 'null'
          description: The name of this resource type, likely the same as `id`
          example: User
        description:
          type:
          - string
          - 'null'
          description: A description of this resource type
          example: User Account
        endpoint:
          type:
          - string
          - 'null'
          description: Where this resource type is located on the server
          example: /Users
        schema:
          type:
          - string
          - 'null'
          description: The schema uri associated with this resource type
          example: urn:ietf:params:scim:schemas:core:2.0:User
        schemaExtensions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AcxApi.Scim.Resources.ResourceType.SchemaExtension'
          description: Any extensions of this resource type
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.beauthenticx.com/connect/token
          scopes:
            acxapi: Access to Acx API
x-provenance:
  method: harvested
  publisher: Authenticx
  source: https://api.beauthenticx.com/swagger/v1/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
