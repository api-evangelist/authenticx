summary: >-
  Authenticx publishes NO rate-limit NUMBERS — not a request ceiling, not a window, not a burst, not a quota,
  on any surface. Eight guide pages, the full API reference and the complete llms.txt page index were searched
  for limits, throttling, quotas, concurrency caps and 429 semantics, and no prose limit exists anywhere. What
  the OpenAPI does declare, and what the docs never mention, is that POST /Media/Upload answers 429 "Too Many
  Requests" with a Retry-After header giving "Seconds to wait before retrying after a rate limit". So a limit
  demonstrably EXISTS and is enforced on the ingest path — Authenticx simply never says what it is. That is
  the finding: the mechanism is in the contract, the magnitude is not, which leaves an integrator to discover
  their ceiling by hitting it in production. Separately, two PAYLOAD limits are published — a 2.5GB per-file
  upload ceiling and a 1000-row page cap — recorded below so they are not mistaken for the missing throughput
  contract.
