# --- Cross-cutting semantics captured in conventions/ -------------------------------------------------------
- target: $.info
  update:
    x-apievangelist-conventions:
      pagination:
        style: cursor
        params: [PageSize, LastId]
        casing_warning: GET /ModelResults uses lastId/pageSize; all other paged operations use LastId/PageSize.
        scim: startIndex + count (RFC 7644 3.4.2.4)
      idempotency:
        supported: false
        note: >-
          No idempotency key. POST /Media/Upload rejects duplicates on file-name uniqueness only, which is a
          constraint rather than an idempotency contract.
      errors:
        format: none
        note: No RFC 9457. 45 of 47 declared non-2xx responses carry no schema. SCIM errors use scim+json.
      rate_limits:
        published: false
        signal: 429 on POST /Media/Upload only; no Retry-After, no X-RateLimit-* headers.
      events:
        webhooks: false
        asyncapi: false
        note: Asynchronous processing completion is discovered by polling.
      conversation_identity:
        note: One conversation id travels the API under five field names.
        aliases:
          Metadata: Id
          Evaluations: Metadata.Id
          Insights: ConversationId
          Receipts: ConversationId
          Transcriptions: ConversationId (response) / conversationId (request)

# --- The largest single gap in the published spec: no operationId on any of 46 operations -------------------
- target: $.info
  update:
    x-apievangelist-findings:
    - id: no-operation-ids
      severity: high
      detail: >-
        All 46 operations lack operationId. Generated clients, MCP tools, Arazzo workflows and agent skills
        have no stable handle and must bind by METHOD + path.
    - id: no-error-schemas
      severity: high
      detail: >-
        Outside the SCIM subtree, no 4xx/5xx response declares a schema or media type — only a description
        string. Clients cannot branch programmatically on failure.
    - id: oidc-issuer-mismatch
      severity: medium
      detail: >-
        /.well-known/openid-configuration on api.beauthenticx.com advertises an issuer and endpoints on
        acxapi-net8d-prod1.azurewebsites.net, not on the branded host the docs tell integrators to call.
    - id: no-security-txt
      severity: medium
      detail: No /.well-known/security.txt on any Authenticx host; no published vulnerability disclosure policy.
    - id: undocumented-rate-limits
      severity: medium
      detail: 429 is declared but no quota, Retry-After, or rate-limit documentation exists.
    - id: no-sdks
      severity: medium
      detail: >-
        A 46-operation OpenAPI with no published client library in any registry; only copy-paste recipes.
    - id: no-deprecation-policy
      severity: low
      detail: >-
        Three operations and one field are flagged deprecated in-spec with named replacements, but there is no
        deprecation policy page, no sunset dates, and no RFC 8594 headers.

# --- Mark the deprecated surface with its replacement, machine-readably --------------------------------------
- target: $.paths['/Interactions'].get
  update:
    x-apievangelist-superseded-by: 'GET /Conversations/Insights'
- target: $.paths['/Interactions'].post
  update:
    x-apievangelist-superseded-by: 'POST /Conversations/Insights'
- target: $.paths['/Interactions/{AmdID}'].get
  update:
    x-apievangelist-superseded-by: 'GET /Conversations/Insights'

# --- Document the entitlement-gated and throttled operations --------------------------------------------------
- target: $.paths['/ModelResults/Conversation'].get
  update:
    x-apievangelist-entitlement: >-
      Returns 501 when the endpoint is not enabled for the calling organization. Treat 501 as a licensing
      signal, not a server fault.
- target: $.paths['/Media/Upload'].post
  update:
    x-apievangelist-throttled: >-
      The only operation in the API that declares 429. No Retry-After and no published quota; back off
      exponentially.
    x-apievangelist-duplicate-guard: >-
      A 400 'An interaction with this file name already exists.' on retry indicates the prior attempt
      succeeded. Treat that specific message as success, not failure.
