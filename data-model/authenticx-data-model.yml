summary:
  entities: 14
  schemas_in_spec: 78
  identifier_format: GUID/UUID
  identifier_prefixes: none
  identifier_note: >-
    Authenticx does not use typed/prefixed object ids. Every id is a bare GUID, so an id is only interpretable
    in the context of the endpoint that returned it. The one conversation identity travels the API under five
    different field names (see conventions/authenticx-conventions.yml#identifiers).
core_axis:
  entity: Conversation
  note: >-
    The API has no `/Conversations/{id}` resource — the conversation is the implicit hub that Metadata,
    Insights, Transcriptions, Evaluations, ModelResults and Receipts all key on. Metadata.id IS the conversation
    id; every other section refers to the same value as conversationId (or Metadata.Id nested inside an
    Evaluation).
