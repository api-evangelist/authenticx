format: none
format_note: >-
  AcxAPI does NOT use RFC 9457 problem+json. The only response media types in the spec are application/json and
  application/scim+json. Non-2xx responses are declared with a description but, outside SCIM, carry no response
  schema at all — 28 of 28 declared 400s, all 15 404s, the 429 and the 500 have `content` absent. The documented
  error bodies for /Media/Upload are bare English strings. SCIM errors are the exception: they are typed
  application/scim+json per RFC 7644.
envelope:
  general: >-
    Undeclared. The docs show plain-string messages ("You must upload a file with one of the specified allowed
    extensions.") rather than a structured envelope. Agents cannot machine-branch on an error code.
  scim: application/scim+json (RFC 7644 §3.12 Error response)
status_codes_declared:
  '200': 44
  '201': 1
  '204': 1
  '400': 28
  '404': 15
  '409': 1
  '429': 1
  '500': 1
  '501': 1
