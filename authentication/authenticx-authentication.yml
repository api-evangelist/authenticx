observations:
- >-
  The discovery document's `issuer` and every advertised endpoint point at the underlying Azure App Service
  hostname (acxapi-net8d-prod1.azurewebsites.net), not at the public api.beauthenticx.com host that serves the
  document. A strict OIDC client that follows discovery will therefore be redirected off the branded host, and
  the token endpoint the docs tell integrators to call (api.beauthenticx.com/connect/token) is NOT the one the
  discovery document advertises. Worth raising with the provider.
- >-
  The OpenAPI declares only the `clientCredentials` flow and only the `acxapi` scope, while the OIDC provider
  advertises authorization_code, implicit, device_code and CIBA plus openid/profile/email/address/roles/
  offline_access. The extra grants and scopes serve the AcxPlatform web application and the documented
  "Authenticx as an Auth Provider" Salesforce OIDC integration, not AcxAPI machine-to-machine access.
- >-
  Access tokens expire after 3600 seconds (documented); the client-credentials flow has no refresh token, so
  integrators re-request a token.
